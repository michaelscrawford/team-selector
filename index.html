<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Lineup Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      color: #1f2328;
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #57606a;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1.5px solid #c8d0da;
      border-radius: 8px;
      background: #fff;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82d4;
    }

    .hint {
      font-size: 0.78rem;
      color: #57606a;
      margin-top: 5px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      background: #3b82d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:active { background: #2d6bb5; }

    #error {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: #fff0f0;
      border: 1px solid #f5c2c2;
      border-radius: 8px;
      color: #c0392b;
      font-size: 0.88rem;
    }

    #output { margin-top: 24px; }

    .match-block {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .match-title {
      font-size: 1rem;
      font-weight: 700;
      color: #3b82d4;
      margin-bottom: 10px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 6px;
    }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 0.95rem;
      align-items: baseline;
    }

    .pos {
      font-weight: 700;
      min-width: 42px;
      color: #57606a;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .names { flex: 1; line-height: 1.5; }

    .swap-note {
      margin-top: 9px;
      font-size: 0.75rem;
      color: #57606a;
      font-style: italic;
      border-top: 1px solid #f0f0f0;
      padding-top: 7px;
    }

    .summary-wrap {
      margin-bottom: 18px;
    }

    .summary-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .summary {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .summary th {
      background: #f7f8fa;
      color: #57606a;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1.5px solid #e5e7eb;
    }

    .summary th:first-child { text-align: left; }

    .summary td {
      padding: 7px 10px;
      text-align: center;
      border-bottom: 1px solid #f0f2f4;
      color: #1f2328;
    }

    .summary td.pname { text-align: left; font-weight: 500; }

    .summary tbody tr:last-child td { border-bottom: none; }

    .summary td:not(.pname) {
      font-variant-numeric: tabular-nums;
      color: #3b82d4;
      font-weight: 600;
    }

  </style>
</head>
<body>

  <h1>⚽ Lineup Generator</h1>
  <p class="subtitle">4 matches · everyone plays every position</p>

  <label for="players">Enter player names (one per line) <span id="pcount" style="font-weight:400;color:#57606a;"></span></label>
  <textarea id="players" oninput="updateCount()" placeholder="Aoibhín&#10;Bríd&#10;Caoimhe&#10;Dearbhla&#10;Eimear&#10;Fiadh&#10;Gráinne"></textarea>
  <p class="hint">7 or 8 players supported.</p>

  <button onclick="generate()">Generate Lineups</button>

  <div id="error"></div>
  <div id="output"></div>

<script>
function fmt(n) {
  if (n === 0) return '-';
  var whole = Math.floor(n);
  var half  = (n % 1 !== 0);
  if (whole === 0) return '½';
  if (!half) return String(whole);
  return whole + '½';
}

var FORMATIONS = {
  7: { def: 2, mid: 2, fwd: 2 },
  8: { def: 2, mid: 3, fwd: 2 }
};

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('output').innerHTML = '';
}

function updateCount() {
  var raw = document.getElementById('players').value;
  var n = raw.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; }).length;
  var el = document.getElementById('pcount');
  if (n === 0) {
    el.textContent = '';
  } else {
    var ok = (n === 7 || n === 8);
    el.textContent = '— ' + n + ' player' + (n === 1 ? '' : 's');
    el.style.color = ok ? '#2a7d4f' : '#c0392b';
  }
}

function generate() {
  document.getElementById('error').style.display = 'none';
  var raw = document.getElementById('players').value;
  var players = raw.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
  var n = players.length;

  if (!FORMATIONS[n]) {
    showError(n + ' players entered. Please enter exactly 7 or 8 players.');
    return;
  }

  var seen = {};
  for (var i = 0; i < players.length; i++) {
    var name = players[i].toLowerCase();
    if (seen[name]) {
      showError('Duplicate name "' + players[i] + '" — all player names must be unique.');
      return;
    }
    seen[name] = true;
  }

  var result = buildLineups(players, FORMATIONS[n]);
  if (!result) {
    showError('Could not generate valid lineups. Please try again.');
    return;
  }
  renderOutput(result, players);
}

// Valid role-combos for a player's 3 free slots (must include mid + fwd).
var COMBOS3 = [
  ['def','mid','fwd'],['def','fwd','mid'],
  ['mid','def','fwd'],['mid','fwd','def'],
  ['fwd','def','mid'],['fwd','mid','def'],
  ['mid','mid','fwd'],['mid','fwd','mid'],['fwd','mid','mid'],
  ['mid','fwd','fwd'],['fwd','mid','fwd'],['fwd','fwd','mid']
];


function buildLineups(players, formation) {
  var numDef = formation.def;
  var numMid = formation.mid;
  var numFwd = formation.fwd;
  var n = players.length;
  var MATCHES = 4;
  // For 7 players: 3 matches have a swap, match 3 GK plays the full game.
  // For 8/9 players: all 4 matches have a swap.
  var numSwap = (n === 7) ? 3 : 4;

  // How many full-DEF slots are needed per match (beyond the swap player).
  // Matches with a swap: numDef-1. Match without swap (n=7, m=3): numDef.
  var defNeeds = [0,0,0,0];
  for (var m = 0; m < MATCHES; m++) {
    defNeeds[m] = (m < numSwap) ? numDef - 1 : numDef;
  }

  for (var attempt = 0; attempt < 500; attempt++) {
    var order = shuffle(players.slice());
    var role = {};
    for (var pi = 0; pi < n; pi++) role[players[pi]] = [null,null,null,null];

    var startGKs = order.slice(0, 4);
    var swappers  = order.slice(4, 4 + numSwap);

    for (var m = 0; m < MATCHES; m++) role[startGKs[m]][m] = 'gk';
    for (var m = 0; m < numSwap; m++) role[swappers[m]][m] = 'swap';

    var defCount = [0,0,0,0];
    var midCount = [0,0,0,0];
    var fwdCount = [0,0,0,0];
    var pList = shuffle(players.slice());

    // Backtracker — no function declarations inside the loop.
    var solved = bt(0, pList, role, defCount, midCount, fwdCount, defNeeds, numMid, numFwd, MATCHES);
    if (!solved) continue;
    return { role: role, startGKs: startGKs, swappers: swappers, numSwap: numSwap };
  }
  return null;
}

function bt(i, pList, role, defCount, midCount, fwdCount, defNeeds, numMid, numFwd, MATCHES) {
  if (i === pList.length) {
    for (var m = 0; m < MATCHES; m++) {
      if (defCount[m] !== defNeeds[m]) return false;
      if (midCount[m] !== numMid) return false;
      if (fwdCount[m] !== numFwd) return false;
    }
    return true;
  }
  var p = pList[i];
  var free = [];
  for (var m = 0; m < MATCHES; m++) if (role[p][m] === null) free.push(m);

  var combos = shuffle(COMBOS3.slice());

  for (var ci = 0; ci < combos.length; ci++) {
    var combo = combos[ci];
    if (combo.length !== free.length) continue;

    var ok = true;
    for (var si = 0; si < free.length; si++) {
      var s = free[si], r = combo[si];
      if (r === 'def' && defCount[s] >= defNeeds[s]) { ok = false; break; }
      if (r === 'mid' && midCount[s] >= numMid)       { ok = false; break; }
      if (r === 'fwd' && fwdCount[s] >= numFwd)       { ok = false; break; }
    }
    if (!ok) continue;

    for (var si = 0; si < free.length; si++) {
      var s = free[si], r = combo[si];
      role[p][s] = r;
      if (r === 'def') defCount[s]++; else if (r === 'mid') midCount[s]++; else fwdCount[s]++;
    }
    if (bt(i+1, pList, role, defCount, midCount, fwdCount, defNeeds, numMid, numFwd, MATCHES)) return true;
    for (var si = 0; si < free.length; si++) {
      var s = free[si], r = combo[si];
      role[p][s] = null;
      if (r === 'def') defCount[s]--; else if (r === 'mid') midCount[s]--; else fwdCount[s]--;
    }
  }
  return false;
}

function renderOutput(result, players) {
  var role = result.role;
  var startGKs = result.startGKs;
  var swappers = result.swappers;
  var numSwap = result.numSwap;
  var out = document.getElementById('output');
  out.innerHTML = '';

  // ── Summary table ────────────────────────────────────────────────────────
  // Count position appearances per player.
  // 'gk'   = 0.5 GK + 0.5 DEF  (starts GK, drops to DEF at HT)
  // 'swap' = 0.5 DEF + 0.5 GK  (starts DEF, goes to GK at HT)
  // 'def'  = 1.0 DEF
  // 'mid'  = 1.0 MID
  // 'fwd'  = 1.0 FWD
  var counts = {};
  for (var pi = 0; pi < players.length; pi++) {
    var p = players[pi];
    counts[p] = { G: 0, D: 0, M: 0, F: 0 };
    for (var m2 = 0; m2 < 4; m2++) {
      var r = role[p][m2];
      var hasSwap = m2 < numSwap; // false for the no-swap match in 7-player games
      if (r === 'gk')   { counts[p].G += hasSwap ? 0.5 : 1; counts[p].D += hasSwap ? 0.5 : 0; }
      if (r === 'swap') { counts[p].G += 0.5; counts[p].D += 0.5; }
      if (r === 'def')  { counts[p].D += 1; }
      if (r === 'mid')  { counts[p].M += 1; }
      if (r === 'fwd')  { counts[p].F += 1; }
    }
  }

  var tbl = document.createElement('div');
  tbl.className = 'summary-wrap';
  var html = '<div class="summary-title">Position summary</div>' +
    '<table class="summary"><thead><tr>' +
    '<th>Player</th><th>G</th><th>D</th><th>M</th><th>F</th>' +
    '</tr></thead><tbody>';
  for (var pi = 0; pi < players.length; pi++) {
    var p = players[pi];
    var c = counts[p];
    html += '<tr>' +
      '<td class="pname">' + p + '</td>' +
      '<td>' + fmt(c.G) + '</td>' +
      '<td>' + fmt(c.D) + '</td>' +
      '<td>' + fmt(c.M) + '</td>' +
      '<td>' + fmt(c.F) + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  tbl.innerHTML = html;
  out.appendChild(tbl);

  for (var m = 0; m < 4; m++) {
    var gkPlayer  = startGKs[m];
    var swapPlayer = m < numSwap ? swappers[m] : null;

    var defFull = players.filter(function(p) { return role[p][m] === 'def'; });
    var mids    = players.filter(function(p) { return role[p][m] === 'mid'; });
    var fwds    = players.filter(function(p) { return role[p][m] === 'fwd'; });

    var defParts = defFull.slice();
    if (swapPlayer) defParts.push(swapPlayer + '*');
    var defLine = defParts.join(', ');

    var swapNote = swapPlayer
      ? '* swaps to GK at half-time · ' + gkPlayer + ' drops to defence'
      : 'No half-time swap this match';

    var block = document.createElement('div');
    block.className = 'match-block';
    block.innerHTML =
      '<div class="match-title">Match ' + (m + 1) + '</div>' +
      '<div class="row"><span class="pos">GK</span><span class="names">' + gkPlayer + '</span></div>' +
      '<div class="row"><span class="pos">DEF</span><span class="names">' + defLine + '</span></div>' +
      '<div class="row"><span class="pos">MID</span><span class="names">' + mids.join(', ') + '</span></div>' +
      '<div class="row"><span class="pos">FWD</span><span class="names">' + fwds.join(', ') + '</span></div>' +
      '<div class="swap-note">' + swapNote + '</div>';
    out.appendChild(block);
  }
}
</script>
</body>
</html>
